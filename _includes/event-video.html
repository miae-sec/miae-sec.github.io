{% if include.url contains "v=" %}
  {% assign video_id = include.url | split: "v=" | last | split: "&" | first %}
{% else %}
  {% assign video_id = include.url | split: "?" | first | split: "/" | last %}
{% endif %}
<div class="event-video{% if include.url contains '/shorts/' %} event-video--vertical{% endif %}">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ video_id }}"
          title="Event video"
          loading="lazy"
          allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen></iframe>
</div>
